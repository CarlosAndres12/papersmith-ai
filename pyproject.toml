[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersmith-ai"
dynamic = ["version"]
description = "CLI workspace orchestrator for the papersmith-ai scientific paper engineering framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
papersmith = "papersmith.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["papersmith*"]

[tool.setuptools.package-data]
papersmith = ["templates/*.tpl", "_kit/**/*"]

[tool.setuptools.dynamic]
version = {attr = "papersmith.__version__"}
